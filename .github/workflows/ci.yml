name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tresser
          POSTGRES_PASSWORD: tresser
          POSTGRES_DB: tresser
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tresser:tresser@localhost:5432/tresser
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_HMAC_SECRET: ci-only-hmac-ci-only-hmac-ci-only-hmac-xx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
